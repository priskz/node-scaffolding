# node-scaffolding — Local Development Infrastructure
# Usage:
#   docker compose up                        # default: db, cache, mail
#   docker compose --profile full up         # + adminer
#
# Copy .env.example to .env to override defaults.

name: node-scaffolding

services:

  # ---------------------------------------------------------------------------
  # PostgreSQL 16
  # ---------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-local}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local}
      POSTGRES_DB: ${POSTGRES_DB:-scaffolding}
    ports:
      - "${DB_PORT:-2640}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-local}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  # Alternative: MySQL 8 — swap the db block above for this
  # db:
  #   image: mysql:8
  #   environment:
  #     MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-local}
  #     MYSQL_DATABASE: ${POSTGRES_DB:-scaffolding}
  #     MYSQL_USER: ${POSTGRES_USER:-local}
  #     MYSQL_PASSWORD: ${POSTGRES_PASSWORD:-local}
  #   ports:
  #     - "${DB_PORT:-2640}:3306"
  #   volumes:
  #     - db-data:/var/lib/mysql
  #   healthcheck:
  #     test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
  #     interval: 5s
  #     timeout: 5s
  #     retries: 5
  #   networks:
  #     - app-network

  # ---------------------------------------------------------------------------
  # Valkey 8 (Redis-compatible)
  # ---------------------------------------------------------------------------
  cache:
    image: valkey/valkey:8-alpine
    ports:
      - "${CACHE_PORT:-2650}:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  # Alternative: Redis 7 — swap the cache block above for this
  # cache:
  #   image: redis:7-alpine
  #   ports:
  #     - "${CACHE_PORT:-2650}:6379"
  #   healthcheck:
  #     test: ["CMD", "redis-cli", "ping"]
  #     interval: 5s
  #     timeout: 5s
  #     retries: 5
  #   networks:
  #     - app-network

  # ---------------------------------------------------------------------------
  # Mailpit — local email capture
  # ---------------------------------------------------------------------------
  mail:
    image: axllent/mailpit
    ports:
      - "${MAIL_UI_PORT:-2660}:8025"
      - "${MAIL_SMTP_PORT:-2661}:1025"
    networks:
      - app-network

  # ---------------------------------------------------------------------------
  # Adminer — database UI (full profile)
  # ---------------------------------------------------------------------------
  adminer:
    profiles: ["full"]
    image: adminer
    ports:
      - "${ADMINER_PORT:-2670}:8080"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network

volumes:
  db-data:

networks:
  app-network:
    driver: bridge
